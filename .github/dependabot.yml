version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 1
    groups:
      x402-sdk:
        patterns:
          - "@x402/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "express"
        update-types:
          - "version-update:semver-major"
